<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editor — portfolio content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F3F1;--paper-2:#FAFBFA;--ink:#14161C;--ink-2:#3E4249;--mute:#83887F;--line:#D8DCD8;--wire:#4F46E5;--mint:#00A87E;--amber:#C46A11;--red:#C0392B;--r:5px;
--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Instrument Sans",system-ui,sans-serif;--fm:"JetBrains Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);font-weight:800;letter-spacing:-.03em;margin:0}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}
.bar{position:sticky;top:0;z-index:30;background:rgba(241,243,241,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin-right:auto;display:flex;align-items:center;gap:9px}
.bar h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--wire)}
.vtag{font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;color:var(--mute);font-weight:400;border:1px solid var(--line);border-radius:100px;padding:2px 8px}
.saved{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-right:14px}
button,.btn{font-family:var(--fb);font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper-2);color:var(--ink);cursor:pointer;transition:.15s;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink)}
button.primary{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
button.primary:hover{opacity:.86}
button.mini{font-size:11.5px;padding:5px 10px}
button.danger{color:var(--red);border-color:#e6cfcb}
button.danger:hover{border-color:var(--red)}
.layout{display:grid;grid-template-columns:196px 1fr;gap:0;align-items:start}
.side{position:sticky;top:57px;padding:22px 0 22px 22px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:var(--r);color:var(--ink-2);font-size:14.5px;margin-bottom:2px}
.side button:hover{background:var(--paper-2)}
.side button[aria-current="true"]{background:var(--ink);color:var(--paper-2);font-weight:500}
.side .grp{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:14px 12px 6px}
main{padding:26px 26px 120px;max-width:900px}
.panel{display:none}
.panel.on{display:block}
.panel > h2{font-size:26px;margin-bottom:6px}
.panel > .sub{color:var(--mute);font-size:14px;margin-bottom:24px}
.f{margin-bottom:18px}
.f label{display:block;font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.f .hint{font-size:12.5px;color:var(--mute);margin-top:5px}
input[type=checkbox]{accent-color:var(--wire);width:16px;height:16px}
input[type=text],textarea,select{width:100%;font-family:var(--fb);font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper-2);color:var(--ink);resize:vertical}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{line-height:1.6}
textarea.code{font-family:var(--fm);font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.item{border:1px solid var(--line);border-radius:9px;background:var(--paper-2);margin-bottom:14px;overflow:hidden}
.item-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.item-head .t{font-weight:600;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .n{font-family:var(--fm);font-size:11px;color:var(--mute);flex:none}
.item-body{padding:4px 16px 18px;border-top:1px solid var(--line);display:none}
.item.open .item-body{display:block}
.item.open .item-head{background:var(--paper)}
.pairs .pair{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px;align-items:center}
.pairs .pair button{padding:6px 9px;font-size:11px}
.addbtn{font-size:13px;padding:7px 12px;border-style:dashed;width:100%}
.listbar{position:sticky;top:57px;z-index:12;display:flex;align-items:center;gap:12px;background:var(--paper);padding:10px 0 14px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.listbar .count{font-family:var(--fm);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-right:auto}
.empty{border:1px dashed var(--line);border-radius:9px;padding:26px 22px;text-align:center;color:var(--mute);font-size:14px;margin:18px 0}
.empty p{margin:0 0 6px}
.empty b{color:var(--ink);font-weight:600}
.cvprev{margin-top:10px}
.cvprev canvas{border-radius:6px;border:1px solid var(--line);display:block}
.tcprev{width:190px;height:100px;border-radius:6px;border:1px solid var(--line);padding:12px 13px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;position:relative;overflow:hidden;background:#14161C}
.tcprev::after{content:"";position:absolute;right:-38px;top:-38px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--acc) 0%,transparent 68%);opacity:.34}
.tcprev .b{width:20px;height:2px;border-radius:2px;background:var(--acc);position:relative}
.tcprev .t{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.05;color:#F7F8F7;position:relative;overflow:hidden}
.tcprev .m{font-family:var(--fm);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(247,248,247,.62);position:relative}
.tip{background:#EDF0FA;border:1px solid #cdd4f2;border-radius:9px;padding:14px 16px;font-size:13.5px;color:#2b3168;margin-bottom:22px}
.tip b{font-weight:600}
.tip code{font-family:var(--fm);font-size:12px;background:#fff;padding:1px 5px;border-radius:3px}
.warn{background:#FBF1E4;border-color:#eeddc0;color:#5a4114}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper-2);font-family:var(--fm);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:11px 18px;border-radius:100px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){
  .layout{grid-template-columns:1fr}
  .side{position:static;padding:14px 18px 0;display:flex;gap:6px;overflow-x:auto}
  .side .grp{display:none}
  .side button{width:auto;white-space:nowrap;border:1px solid var(--line)}
  main{padding:18px 18px 100px}
  .row,.row3{grid-template-columns:1fr}
  .pairs .pair{grid-template-columns:1fr auto}
}
</style>
</head>
<body>

<div class="bar">
  <h1><span class="dot"></span>Content editor <span class="vtag" id="ver"></span></h1>
  <span class="saved" id="saved">Draft saved</span>
  <button id="preview">Preview site</button>
  <button id="import">Import file</button>
  <button id="revert" class="danger">Discard draft</button>
  <button id="download" class="primary">Download content.json</button>
</div>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const VERSION = "0.8";
const KEY = "njp_draft";
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let D = null, tab = "site";

const BLANK = {
  project: { slug: "new-project", title: "New project", role: "", year: String(new Date().getFullYear()), cat: "Pipeline", tags: [], image: "", video: "", media: [], links: [], coverStyle: "auto", coverColor: "multi", blurb: "", meta: [], problem: "", approach: [], result: [], impact: [], learn: "" },
  job: { role: "New role", org: "", fromMonth: "", fromYear: "", toMonth: "", toYear: "", present: true, image: "", video: "", bullets: [] },
  post: { slug: "new-post", date: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }), title: "New post", excerpt: "", image: "", video: "", media: [], body: "<p></p>" },
  skillgroup: { h: "New group", items: [], image: "", video: "" }
};
const TABS = [
  ["Basics", [["site", "Name & intro"], ["stats", "Hero numbers"], ["facts", "Quick facts"]]],
  ["Content", [["projects", "Case studies"], ["experience", "Experience"], ["skills", "Toolset"], ["posts", "Blog posts"]]],
  ["Links", [["social", "Contact links"]]]
];

/* ---------- storage ---------- */
async function boot() {
  const draft = LS.get(KEY);
  if (draft) { try { D = JSON.parse(draft); mark("Draft restored"); } catch (e) {} }
  if (!D) {
    try { const r = await fetch("content.json", { cache: "no-store" }); if (r.ok) D = await r.json(); } catch (e) {}
  }
  if (!D) { D = { site: {}, stats: [], facts: [], projects: [], experience: [], skills: [], posts: [], social: [] }; mark("Empty — start typing"); }
  for (const k of ["stats", "facts", "projects", "experience", "skills", "posts", "social"]) D[k] = D[k] || [];
  D.projects.forEach(p => { p.media = p.media || []; p.video = p.video || ""; p.image = p.image || ""; p.coverStyle = p.coverStyle || "auto"; p.coverColor = p.coverColor || "multi"; p.links = p.links || []; });
  D.posts.forEach(p => { p.media = p.media || []; p.video = p.video || ""; p.image = p.image || ""; });
  D.skills.forEach(g => { g.video = g.video || ""; g.image = g.image || ""; });
  D.social.forEach(s => { if (/^mailto:/i.test(s.v || "")) s.v = s.v.replace(/^mailto:/i, ""); });
  D.site.avatar = D.site.avatar || ""; D.site.cover = D.site.cover || "";
  D.experience.forEach(j => {
    j.image = j.image || ""; j.video = j.video || "";
    if (!j.fromYear && !j.present && j.when) {
      const yrs = String(j.when).match(/\d{4}/g) || [];
      j.fromYear = yrs[0] || ""; j.present = /present|now/i.test(j.when); j.toYear = j.present ? "" : (yrs[1] || "");
      j.fromMonth = j.fromMonth || ""; j.toMonth = j.toMonth || "";
    }
  });
  D.site = D.site || {};
  $("#ver").textContent = "v" + VERSION;
  buildNav(); draw();
  if (!LS.set("njp_test", "1")) warnNoStorage(); else LS.del("njp_test");
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (LS.set(KEY, JSON.stringify(D))) mark("Draft saved " + new Date().toLocaleTimeString());
    else { mark("Draft not saved — download before closing"); warnNoStorage(); }
  }, 250);
}
const mark = t => $("#saved").textContent = t;
function hrefFor(v) {
  const s = String(v || "").trim();
  if (!s) return "#";
  if (/^(https?:|mailto:|tel:|\/|#)/i.test(s)) return s;
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return "mailto:" + s;
  return "https://" + s.replace(/^\/+/, "");
}
let warned = false;
function warnNoStorage() {
  if (warned) return; warned = true;
  const d = document.createElement("div");
  d.className = "tip warn";
  d.style.cssText = "position:sticky;top:57px;z-index:20;margin:0 0 16px";
  d.innerHTML = "<b>This browser won't let this page save drafts.</b> That happens when you open the file directly from your computer. Everything still works and <b>Preview site</b> is unaffected, but your work isn't kept if you close the tab — click <b>Download content.json</b> before you leave. To get autosave back, run <code>python3 -m http.server</code> in this folder and open <code>localhost:8000/editor.html</code> instead.";
  const main = $("#main"); if (main) main.prepend(d);
}
function whenOf(j) {
  if (j.fromYear || j.toYear || j.present) {
    const a = [j.fromMonth, j.fromYear].filter(Boolean).join(" ");
    const b = j.present ? "Present" : [j.toMonth, j.toYear].filter(Boolean).join(" ");
    return [a, b].filter(Boolean).join(" — ");
  }
  return j.when || "";
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2000); }

/* ---------- field helpers ---------- */
const enc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function bind(el, get, set) {
  el.value = get() ?? "";
  el.addEventListener("input", () => { set(el.value); save(); });
}
function field(label, hint, inputHTML) {
  return `<div class="f"><label>${label}</label>${inputHTML}${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
}
function text(obj, key, label, hint = "", ph = "") {
  const id = "i" + Math.random().toString(36).slice(2);
  queueMicrotask(() => { const el = $("#" + id); if (el) bind(el, () => obj[key], v => obj[key] = v); });
  return field(label, hint, `<input type="text" id="${id}" placeholder="${enc(ph)}">`);
}
function area(obj, key, label, hint = "", rows = 4, code = false) {
  const id = "i" + Math.random().toString(36).slice(2);
  queueMicrotask(() => { const el = $("#" + id); if (el) bind(el, () => obj[key], v => obj[key] = v); });
  return field(label, hint, `<textarea id="${id}" rows="${rows}" class="${code ? "code" : ""}"></textarea>`);
}
/* array of strings, one per line */
function lines(obj, key, label, hint = "", rows = 5) {
  const id = "i" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const el = $("#" + id); if (!el) return;
    el.value = (obj[key] || []).join("\n");
    el.addEventListener("input", () => { obj[key] = el.value.split("\n").map(s => s.trim()).filter(Boolean); save(); });
  });
  return field(label, hint || "One per line.", `<textarea id="${id}" rows="${rows}"></textarea>`);
}
/* array of {k,v} */
function pairs(obj, key, label, kPh, vPh, hint = "", resolve = null) {
  const id = "p" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const wrap = $("#" + id); if (!wrap) return;
    const paint = () => {
      wrap.innerHTML = (obj[key] || []).map((_, i) =>
        `<div class="pair"><input type="text" data-i="${i}" data-f="k" placeholder="${enc(kPh)}"><input type="text" data-i="${i}" data-f="v" placeholder="${enc(vPh)}"><button class="mini danger" data-del="${i}">✕</button></div>` + (resolve ? `<div class="hint" data-res="${i}" style="margin:-4px 0 12px">
        </div>` : "")
      ).join("") + `<button class="addbtn" data-add>+ Add row</button>`;
      const res = () => { if (!resolve) return; $$("[data-res]", wrap).forEach(n => n.innerHTML = resolve(obj[key][n.dataset.res])); };
      $$("input", wrap).forEach(inp => {
        inp.value = obj[key][inp.dataset.i][inp.dataset.f] || "";
        inp.addEventListener("input", () => { obj[key][inp.dataset.i][inp.dataset.f] = inp.value; save(); res(); });
      });
      res();
      $$("[data-del]", wrap).forEach(b => b.addEventListener("click", () => { obj[key].splice(+b.dataset.del, 1); save(); paint(); }));
      $("[data-add]", wrap).addEventListener("click", () => { obj[key].push({ k: "", v: "" }); save(); paint(); });
    };
    obj[key] = obj[key] || []; paint();
  });
  return field(label, hint, `<div class="pairs" id="${id}"></div>`);
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ytId(u) {
  if (!u) return "";
  const s = String(u).trim();
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : "");
}
/* youtube url with a live thumbnail check */
function video(obj, key = "video", label = "YouTube video") {
  const id = "v" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const el = $("#" + id), prev = $("#" + id + "p");
    if (!el) return;
    const paint = () => {
      const yid = ytId(el.value);
      prev.innerHTML = yid
        ? `<img src="https://i.ytimg.com/vi/${yid}/mqdefault.jpg" alt="" style="width:150px;border-radius:5px;border:1px solid var(--line);display:block;margin-top:8px">`
        : (el.value.trim() ? `<div class="hint" style="color:var(--red)">That doesn't look like a YouTube link.</div>` : "");
    };
    bind(el, () => obj[key], v => { obj[key] = v; paint(); });
    paint();
  });
  return field(label, "Paste any YouTube link — watch, youtu.be or shorts. It plays inline on the site.",
    `<input type="text" id="${id}" placeholder="https://www.youtube.com/watch?v=..."><div id="${id}p"></div>`);
}
/* image path with a live preview */
function image(obj, key = "image", label = "Image", hint = "Put the file in an images/ folder next to index.html, then type images/your-file.jpg") {
  const id = "g" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const el = $("#" + id), prev = $("#" + id + "p");
    if (!el) return;
    const paint = () => {
      prev.innerHTML = el.value.trim()
        ? `<img src="${enc(el.value)}" alt="" onerror="this.style.display='none'" style="width:150px;border-radius:5px;border:1px solid var(--line);display:block;margin-top:8px">` : "";
    };
    bind(el, () => obj[key], v => { obj[key] = v; paint(); });
    paint();
  });
  return field(label, hint, `<input type="text" id="${id}" placeholder="images/shot.jpg"><div id="${id}p"></div>`);
}
/* cover style picker with a live preview of exactly what the site draws */
const ACC = { indigo: "#4F46E5", mint: "#00A87E", amber: "#C46A11", slate: "#8B8FA3", multi: "multi" };
function prng(seed) { let s = 0; for (const c of String(seed)) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function drawThumb(cv, seed, style, color) {
  const w = 190, h = 100, dpr = 2;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = prng(seed), S = ["flow", "blocks", "dots"];
  const mode = S.indexOf(S.includes(style) ? style : S[Math.floor(r() * 3)]);
  c.fillStyle = "#14161C"; c.fillRect(0, 0, w, h);
  const one = ACC[color];
  const pal = one && one !== "multi" ? [one, one, one, "#8B8FA3"] : ["#4F46E5", "#00A87E", "#C46A11", "#8B8FA3"];
  if (mode === 0) {
    for (let i = 0; i < 26; i++) { const x = r() * w, y = r() * h, len = 16 + r() * 70, a = (r() - .5) * 1.1;
      c.strokeStyle = pal[Math.floor(r() * pal.length)] + "88"; c.lineWidth = .5 + r() * 1.2;
      c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + len * .4, y + a * 32, x + len * .6, y - a * 32, x + len, y + a * 16); c.stroke(); }
  } else if (mode === 1) {
    for (let i = 0; i < 14; i++) { const bw = 12 + r() * 48, bh = 8 + r() * 38, x = r() * (w - bw), y = r() * (h - bh);
      c.strokeStyle = pal[Math.floor(r() * pal.length)] + (r() > .6 ? "cc" : "44"); c.lineWidth = 1; c.strokeRect(x + .5, y + .5, bw, bh);
      if (r() > .72) { c.fillStyle = pal[Math.floor(r() * pal.length)] + "22"; c.fillRect(x, y, bw, bh); } }
  } else {
    const cell = 12;
    for (let x = cell / 2; x < w; x += cell) for (let y = cell / 2; y < h; y += cell) {
      const d = Math.hypot(x - w * .58, y - h * .5) / (w * .6), s = Math.max(.8, (1 - d) * 4.4 * (.5 + r() * .8));
      c.fillStyle = r() > .88 ? pal[Math.floor(r() * 3)] : "#2C3040"; c.beginPath(); c.arc(x, y, s, 0, 7); c.fill(); }
  }
  c.globalAlpha = .5; c.strokeStyle = "#ffffff10"; c.lineWidth = 1;
  for (let x = 0; x < w; x += 14) { c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, h); c.stroke(); }
  for (let y = 0; y < h; y += 14) { c.beginPath(); c.moveTo(0, y + .5); c.lineTo(w, y + .5); c.stroke(); }
}
function cover(p) {
  const id = "cv" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const wrap = $("#" + id); if (!wrap) return;
    const paint = () => {
      const st = p.coverStyle || "auto", col = p.coverColor || "multi";
      const acc = ACC[col] === "multi" || !ACC[col] ? "#4F46E5" : ACC[col];
      const box = $("#" + id + "prev"); if (!box) return;
      if (p.image || ytId(p.video)) {
        box.innerHTML = `<div class="hint">Currently using your ${p.image ? "cover image" : "video thumbnail"}. The style below is only used when both of those are empty.</div>`;
      } else if (st === "title") {
        box.innerHTML = `<div class="tcprev" style="--acc:${acc}"><span class="b"></span><span class="t">${enc(p.title || "Project title")}</span>` +
          `<span class="m">${enc(p.cat || "")}${p.cat && p.year ? " \u00b7 " : ""}${enc(p.year || "")}</span></div>`;
      } else {
        box.innerHTML = `<canvas id="${id}c"></canvas>`;
        drawThumb($("#" + id + "c"), p.slug || "seed", st, col);
      }
    };
    $$("select", wrap).forEach(sel => sel.addEventListener("change", () => { p[sel.dataset.f] = sel.value; save(); paint(); }));
    paint();
  });
  const opt = (v, l, cur) => `<option value="${v}"${cur === v ? " selected" : ""}>${l}</option>`;
  const st = p.coverStyle || "auto", col = p.coverColor || "multi";
  return field("Cover style", "Used when there is no cover image or video. Change it and the preview below updates.",
    `<div id="${id}">
      <div class="row">
        <select data-f="coverStyle">${opt("auto", "Auto \u2014 pick one for me", st)}${opt("title", "Title card", st)}${opt("flow", "Flow lines", st)}${opt("blocks", "Blocks", st)}${opt("dots", "Dot field", st)}</select>
        <select data-f="coverColor">${opt("multi", "Multicolour", col)}${opt("indigo", "Indigo", col)}${opt("mint", "Mint", col)}${opt("amber", "Amber", col)}${opt("slate", "Slate", col)}</select>
      </div>
      <div id="${id}prev" class="cvprev"></div>
    </div>`);
}
/* gallery: repeatable image-or-video rows */
function gallery(obj, key = "media", label = "Gallery") {
  const id = "m" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const wrap = $("#" + id); if (!wrap) return;
    obj[key] = obj[key] || [];
    const paint = () => {
      wrap.innerHTML = obj[key].map((it, i) => `
        <div class="pair" style="grid-template-columns:110px 1fr 1fr auto;margin-bottom:8px">
          <select data-i="${i}" data-f="kind">
            <option value="image">Image</option><option value="video">Video</option>
          </select>
          <input type="text" data-i="${i}" data-f="src" placeholder="${it.kind === "video" ? "YouTube link" : "images/shot.jpg"}">
          <input type="text" data-i="${i}" data-f="caption" placeholder="Caption (optional)">
          <button class="mini danger" data-del="${i}">✕</button>
        </div>`).join("") + `<button class="addbtn" data-add>+ Add image or video</button>`;
      $$("select,input", wrap).forEach(inp => {
        const it = obj[key][inp.dataset.i];
        inp.value = it[inp.dataset.f] || (inp.dataset.f === "kind" ? "image" : "");
        inp.addEventListener("input", () => { it[inp.dataset.f] = inp.value; save(); if (inp.dataset.f === "kind") paint(); });
        inp.addEventListener("change", () => { it[inp.dataset.f] = inp.value; save(); if (inp.dataset.f === "kind") paint(); });
      });
      $$("[data-del]", wrap).forEach(b => b.addEventListener("click", () => { obj[key].splice(+b.dataset.del, 1); save(); paint(); }));
      $("[data-add]", wrap).addEventListener("click", () => { obj[key].push({ kind: "image", src: "", caption: "" }); save(); paint(); });
    };
    paint();
  });
  return field(label, "Shown at the bottom of the case study. Mix images and videos freely.", `<div class="pairs" id="${id}"></div>`);
}
/* month + year range for jobs */
function dates(j) {
  const id = "d" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const wrap = $("#" + id); if (!wrap) return;
    const opts = sel => `<option value="">Month</option>` + MONTHS.map(m => `<option value="${m}"${m === sel ? " selected" : ""}>${m}</option>`).join("");
    const paint = () => {
      wrap.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div><div class="hint" style="margin:0 0 6px">From</div>
            <div style="display:grid;grid-template-columns:1fr 88px;gap:8px">
              <select data-f="fromMonth">${opts(j.fromMonth)}</select>
              <input type="text" data-f="fromYear" placeholder="2024" value="${enc(j.fromYear)}"></div></div>
          <div><div class="hint" style="margin:0 0 6px">To</div>
            <div style="display:grid;grid-template-columns:1fr 88px;gap:8px">
              <select data-f="toMonth"${j.present ? " disabled" : ""}>${opts(j.toMonth)}</select>
              <input type="text" data-f="toYear" placeholder="2025" value="${enc(j.toYear)}"${j.present ? " disabled" : ""}></div></div>
        </div>
        <label style="display:flex;align-items:center;gap:9px;margin-top:12px;font-family:var(--fb);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)">
          <input type="checkbox" data-f="present"${j.present ? " checked" : ""} style="width:auto"> Still working here
        </label>
        <div class="hint" style="margin-top:10px">Shows as <b id="${id}pv"></b></div>`;
      $$("[data-f]", wrap).forEach(inp => {
        const ev = inp.type === "checkbox" || inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(ev, () => {
          j[inp.dataset.f] = inp.type === "checkbox" ? inp.checked : inp.value;
          save();
          if (inp.dataset.f === "present") paint(); else pv();
        });
      });
      pv();
    };
    const pv = () => {
      const a = [j.fromMonth, j.fromYear].filter(Boolean).join(" ");
      const b = j.present ? "Present" : [j.toMonth, j.toYear].filter(Boolean).join(" ");
      const el = $("#" + id + "pv"); if (el) el.textContent = [a, b].filter(Boolean).join(" — ") || "nothing yet";
    };
    paint();
  });
  return field("Dates", "", `<div id="${id}"></div>`);
}
/* repeatable object list */
function list(arr, blankKey, titleFn, subFn, bodyFn, addLabel, one = "entry", many = "entries") {
  const id = "l" + Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const wrap = $("#" + id); if (!wrap) return;
    const paint = () => {
      const bar = `<div class="listbar">
        <span class="count">${arr.length} ${arr.length === 1 ? one : many}</span>
        <button class="primary" data-additem>+ ${addLabel}</button></div>`;
      const empty = `<div class="empty"><p><b>Nothing here yet.</b></p><p>Click <b>+ ${addLabel}</b> above to create your first one. It appears open and ready to fill in.</p></div>`;
      wrap.innerHTML = bar + (arr.length ? "" : empty) + arr.map((it, i) => `
        <div class="item" data-i="${i}">
          <div class="item-head">
            <span class="n">${String(i + 1).padStart(2, "0")}</span>
            <span class="t">${enc(titleFn(it)) || "Untitled"}</span>
            <span class="n">${enc(subFn(it) || "")}</span>
            <button class="mini" data-up="${i}" title="Move up">↑</button>
            <button class="mini" data-down="${i}" title="Move down">↓</button>
            <button class="mini danger" data-rm="${i}">Delete</button>
          </div>
          <div class="item-body"></div>
        </div>`).join("") + (arr.length ? `<button class="addbtn" data-additem>+ ${addLabel}</button>` : "");
      $$(".item", wrap).forEach(el => {
        const i = +el.dataset.i;
        $(".item-body", el).innerHTML = bodyFn(arr[i], i);
        $(".item-head", el).addEventListener("click", e => {
          if (e.target.closest("button")) return;
          el.classList.toggle("open");
        });
      });
      $$("[data-rm]", wrap).forEach(b => b.addEventListener("click", () => {
        if (!confirm("Delete this entry?")) return;
        arr.splice(+b.dataset.rm, 1); save(); paint();
      }));
      $$("[data-up]", wrap).forEach(b => b.addEventListener("click", () => { const i = +b.dataset.up; if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; save(); paint(); } }));
      $$("[data-down]", wrap).forEach(b => b.addEventListener("click", () => { const i = +b.dataset.down; if (i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; save(); paint(); } }));
      $$("[data-additem]", wrap).forEach(b => b.addEventListener("click", () => {
        arr.push(JSON.parse(JSON.stringify(BLANK[blankKey]))); save(); paint();
        const last = $$(".item", wrap).pop();
        if (last) {
          last.classList.add("open");
          if (last.scrollIntoView) last.scrollIntoView({ behavior: "smooth", block: "center" });
          const fi = last.querySelector("input[type=text]"); if (fi) fi.focus();
        }
      }));
    };
    paint();
  });
  return `<div id="${id}"></div>`;
}

/* ---------- panels ---------- */
const TIP_HTML = `<div class="tip"><b>Formatting:</b> you can use <code>&lt;b&gt;bold&lt;/b&gt;</code> inside any paragraph or bullet to highlight a phrase. Everything else is plain text.</div>`;

function panels() {
  const S = D.site;
  return {
    site: `<h2>Name & intro</h2><p class="sub">The header, hero and about section.</p>${TIP_HTML}
      <div class="row">${text(S, "name", "Your name", "", "Navansh Jain")}${text(S, "role", "Role — shown large in the hero", "Each word goes on its own line.", "Technical Artist")}</div>
      ${text(S, "specialty", "Specialty line", "Shown in grey under your role.", "tools, pipeline, procedural art")}
      ${text(S, "available", "Availability badge", "Leave empty to hide the badge entirely.", "Open to technical art roles")}
      ${area(S, "lede", "Hero paragraph", "The first thing people read. Two sentences max.", 3)}
      <div class="row">${image(S, "avatar", "Profile picture", "Square works best. Shown as a circle in the about section.")}${image(S, "cover", "Cover image", "A wide banner across the page, under the hero. Around 2000\u00d7600 is ideal.")}</div>
      <h3 style="font-size:18px;margin:30px 0 14px">About section</h3>
      ${text(S, "aboutHeading", "About heading")}
      ${area(S, "about", "About paragraphs", "One paragraph per line — press Enter to start a new paragraph.", 7)}
      <h3 style="font-size:18px;margin:30px 0 14px">Contact section</h3>
      ${area(S, "contactHeading", "Contact heading", "Line breaks are kept.", 2)}
      ${area(S, "contactBlurb", "Contact paragraph", "", 3)}
      ${text(S, "footNote", "Footer note", "The small line at the very bottom of the page.", "Designed and built with AI assistance")}`,

    stats: `<h2>Hero numbers</h2><p class="sub">The four figures below the hero. Keep it to four for the cleanest layout.</p>
      ${pairs(D, "stats", "Numbers", "6+", "Years in production", "Left column is the big number, right is the label under it.")}`.replace(/"k"/g, '"k"'),

    facts: `<h2>Quick facts</h2><p class="sub">The list beside your about text.</p>
      ${pairs(D, "facts", "Facts", "Based in", "Lucknow, India")}`,

    projects: `<h2>Case studies</h2><p class="sub">Each one becomes a card on the homepage and a full case study page with its own shareable link.</p>${TIP_HTML}
      ${list(D.projects, "project", p => p.title, p => p.year,
      p => `
        <div class="row">${text(p, "title", "Title")}${text(p, "slug", "Link slug", "Lowercase, dashes only. Becomes #work/your-slug", "my-project")}</div>
        <div class="row3">${text(p, "role", "Your role")}${text(p, "year", "Year")}${text(p, "cat", "Category", "Used for the filter buttons.")}</div>
        ${area(p, "blurb", "One-line summary", "Shown on the card.", 2)}
        ${pairs(p, "links", "Links", "ArtStation", "https://artstation.com/artwork/...",
          "Shown as buttons at the top of the case study. Good for ArtStation posts, extra videos, downloads or docs.",
          l => { const v = String((l && l.v) || "").trim(); return v ? `<span style="color:var(--mint)">\u2192 ${enc(hrefFor(v))}</span>` : ""; })}
        ${lines(p, "tags", "Tags", "One per line. Python, Unreal 5, etc.", 4)}
        ${image(p, "image", "Cover image", "Leave empty and a pattern is generated, or a video thumbnail is used if you add one below.")}
        ${video(p, "video", "Feature video")}
        ${cover(p)}
        ${pairs(p, "meta", "Project facts", "Team", "9 artists, 2 engineers")}
        ${area(p, "problem", "The problem", "What was slow, broken or expensive before you got there.", 5)}
        ${lines(p, "approach", "What I did", "One bullet per line.", 6)}
        ${lines(p, "result", "Outcome", "One bullet per line.", 5)}
        ${pairs(p, "impact", "Impact figures", "80%", "fewer tech rejections", "Big number on the left, label on the right.")}
        ${area(p, "learn", "What I'd take forward", "The reflection at the end. Optional but it reads well.", 4)}
        ${gallery(p, "media", "Gallery")}`,
      "Add case study", "case study", "case studies")}`,

    experience: `<h2>Experience</h2><p class="sub">Your job timeline. Newest first.</p>${TIP_HTML}
      ${list(D.experience, "job", j => j.role, j => whenOf(j),
      j => `<div class="row">${text(j, "role", "Job title")}${text(j, "org", "Company")}</div>
        ${dates(j)}
        ${lines(j, "bullets", "What you did there", "One bullet per line.", 6)}
        ${image(j, "image", "Company logo", "Optional. A small square logo shown beside the role.")}
        ${video(j, "video", "Video")}`,
      "Add role", "role", "roles")}`,

    skills: `<h2>Toolset</h2><p class="sub">Three columns reads best. Add or remove groups freely.</p>
      ${list(D.skills, "skillgroup", g => g.h, g => (g.items || []).length + " items",
      g => `${text(g, "h", "Group heading")}${lines(g, "items", "Items", "One per line.", 7)}
        ${image(g, "image", "Image")}${video(g, "video", "YouTube video", )}`,
      "Add group", "group", "groups")}`,

    posts: `<h2>Blog posts</h2><p class="sub">Blog posts. Each gets its own shareable link.</p>
      <div class="tip"><b>Post body:</b> wrap each paragraph in <code>&lt;p&gt;…&lt;/p&gt;</code> and use <code>&lt;h3&gt;…&lt;/h3&gt;</code> for subheadings. Lists use <code>&lt;ul&gt;&lt;li&gt;…&lt;/li&gt;&lt;/ul&gt;</code>.</div>
      ${list(D.posts, "post", p => p.title, p => p.date,
      p => `<div class="row">${text(p, "title", "Title")}${text(p, "date", "Date", "Any format — it's shown as typed.", "12 Jun 2026")}</div>
        ${text(p, "slug", "Link slug", "Becomes #writing/your-slug")}
        ${area(p, "excerpt", "One-line summary", "Shown in the list.", 2)}
        ${image(p, "image", "Cover image")}
        ${video(p, "video", "Video")}
        ${area(p, "body", "Post body", "", 14, true)}
        ${gallery(p, "media", "More images and videos")}`,
      "Add post", "post", "posts")}`,

    social: `<h2>Contact links</h2><p class="sub">Shown as buttons at the bottom of the page.</p>
      ${pairs(D, "social", "Links", "Email", "you@example.com",
        "Just type an email address or a web address \u2014 the link is built for you.",
        s => {
          const v = String((s && s.v) || "").trim();
          if (!v) return "";
          const href = hrefFor(v);
          const kind = href.startsWith("mailto:") ? "Opens their email app" : "Opens in a new tab";
          return `<span style="color:var(--mint)">\u2192 ${enc(href)}</span> &nbsp;\u00b7&nbsp; ${kind}`;
        })}`
  };
}

function buildNav() {
  $("#side").innerHTML = TABS.map(([g, items]) =>
    `<div class="grp">${g}</div>` + items.map(([k, l]) => `<button data-tab="${k}">${l}</button>`).join("")
  ).join("");
  $$("#side button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; draw(); }));
}
function draw() {
  $$("#side button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab));
  $("#main").innerHTML = `<div class="panel on">${panels()[tab]}</div>`;
  window.scrollTo({ top: 0 });
}

/* ---------- toolbar ---------- */
$("#download").addEventListener("click", () => {
  D.version = VERSION;
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "content.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Downloaded — now replace content.json on your host");
});
/* the preview window asks us for the current draft, so it works even on file:// */
addEventListener("message", e => {
  if (e.data && e.data.__njp === "ready" && e.source) {
    try { e.source.postMessage({ __njp: "data", payload: JSON.parse(JSON.stringify(D)) }, "*"); } catch (err) {}
  }
});
$("#preview").addEventListener("click", () => {
  LS.set(KEY, JSON.stringify(D));
  const win = window.open("index.html?preview=1&t=" + Date.now(), "_blank");
  if (!win) toast("Your browser blocked the popup — allow popups for this page");
  else toast("Preview opened in a new tab");
});
$("#import").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { D = JSON.parse(rd.result); for (const k of ["stats","facts","projects","experience","skills","posts","social"]) D[k] = D[k] || []; D.site = D.site || {}; save(); draw(); toast("Imported"); }
    catch (err) { toast("That file isn't valid JSON"); }
  };
  rd.readAsText(f); e.target.value = "";
});
$("#revert").addEventListener("click", async () => {
  if (!confirm("Discard your unsaved draft and reload the published content.json?")) return;
  LS.del(KEY); D = null; await boot(); toast("Draft discarded");
});
addEventListener("beforeunload", () => { LS.set(KEY, JSON.stringify(D)); });

boot();
</script>
